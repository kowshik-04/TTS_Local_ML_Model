name: Voice Lab Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    # Build the CPU image and verify the UI starts without the gated weights.
    # Manual trigger only: this downloads PyTorch and all runtime dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.voice-lab.yml config >/dev/null
          docker compose -f docker-compose.voice-lab.yml \
            -f docker-compose.voice-lab.gpu.yml config >/dev/null

      - name: Build CPU Voice Lab image
        run: docker build -f Dockerfile.voice-lab -t local-voice-studio:ci .

      - name: Start UI without gated weights
        run: |
          docker run -d --name voice-lab-ci -p 7860:7860 \
            -e VOICE_LAB_SKIP_MODELS=1 local-voice-studio:ci
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then
              echo "Voice Lab UI responded."
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' voice-lab-ci 2>/dev/null || echo false)" != "true" ]; then
              echo "Container exited before the UI was ready."
              docker logs voice-lab-ci
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "Timed out waiting for the Voice Lab UI."
              docker logs voice-lab-ci
              exit 1
            fi
            sleep 2
          done
          docker logs voice-lab-ci | tail -60
          curl -fsS http://127.0.0.1:7860/ >/dev/null

      - name: Stop container
        if: always()
        run: docker rm -f voice-lab-ci || true
